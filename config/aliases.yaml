# Lintel alias mechanism — single source of truth
#
# Per design: .claude/engineering/design-archive/lintel-v3.6-alias-mechanism.md (Approach C — central dispatcher)
# Naming decisions: .claude/engineering/design-archive/lintel-v3.6-cohort4-naming-decisions.md (WS-4a + WS-4b)
#
# Three alias kinds: skill-folder, env-var, plugin-slug (last shape-supported but empty).
# Default grace-period: 90 days. Operator-overridable per alias.
# Removal requires explicit PR with `removal_at` date as commit-trigger reference.
#
# Audit log: ~/.lintel/audit/alias-resolution.jsonl
# Listing: bin/li-doctor --aliases

version: 1
as_of: 2026-09-25

skill_aliases: []
  # (the tier-stamp alias retired together with the skill it pointed at; that whole surface is
  #  pack-supplied now, so neither the alias nor its target belongs in the spine)
  # (setup-brain/sync-brain → gbrain-* aliases retired with the skills — ADR-0009 0-ref pruning;
  #  gbrain's query loop was never integrated and nothing referenced the setup/sync surface)

  # ADR-0009 — the 35 engineering sub-skills collapsed into their module's dispatch table.
  # Invoke as /li:<module> <capability> (e.g. /li:ta api-design).

env_var_aliases: []

plugin_slug_aliases:
  # Empty — no plugin-slug renames in v3.6. Shape-supported for future use.
