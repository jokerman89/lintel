{
  "schema_version": 2,
  "description": "Canonical surface registry. JSON is a YAML subset, read with the Python standard library. Documentation is not execution evidence. Missing operation claims expand to unknown; missing observations expand to not_run.",
  "operations": {
    "question": {"intent": "Ask only for a missing decision or permission through the actual host question channel.", "fallback": "conversation"},
    "plan": {"intent": "Preserve the selected work map, acceptance and original task IDs; native plan UI is optional.", "fallback": "artifact-plan"},
    "instructions": {"intent": "Read repository authority and the complete shared session protocol.", "fallback": "explicit-read"},
    "skills": {"intent": "Load the selected canonical workflow, using native discovery only when verified.", "fallback": "explicit-read"},
    "read": {"intent": "Read scoped project files through an available permitted tool.", "fallback": "blocked"},
    "edit": {"intent": "Change only authorized owned paths through an available permitted tool.", "fallback": "blocked"},
    "shell": {"intent": "Run scoped commands using an available interpreter and preserve failures.", "fallback": "blocked"},
    "browser": {"intent": "Use the host browser tool and identify its actual session and artifacts; search is not browser control.", "fallback": "manual-evidence"},
    "delegate": {"intent": "Pass bounded work, source/work/profile identity and a report contract to a real separate context.", "fallback": "manual-handoff"},
    "isolate": {"intent": "Attribute each concurrent writer to disjoint scope and actual isolated changes, not a security claim.", "fallback": "serial"},
    "memory": {"intent": "Read and preserve repository knowledge; optional native memory never replaces it.", "fallback": "artifact-handoff"},
    "resume": {"intent": "Recover from the same committed work map and evidence, not process liveness or newest-file guesses.", "fallback": "artifact-handoff"},
    "hooks": {"intent": "Use only separately authorized, registered, compatible and observed hooks.", "fallback": "unsupported"},
    "plugin_control": {"intent": "Change enablement only through the installed host's documented and authorized API.", "fallback": "unsupported"},
    "model_control": {"intent": "Honor actual configured models; never infer a setting from a role or vendor name.", "fallback": "unsupported"}
  },
