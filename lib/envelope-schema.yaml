# Lintel envelope schema v1 — standardized hand-off payload.
#
# Every Brief Forge hand-off, workflow_root invocation, and cold-executor
# spawn carries an envelope. The envelope has THREE parts:
#
#   HEAD — metadata (6 required fields)
#   BODY — payload, free-form by `content_type` discriminator
#   TAIL — closing context (4 required fields)
#
# Operators who replay envelopes (li-envelope-replay) see exactly what was
# handed off. Operators who audit hand-offs (Brief Forge audit log) see the
# same shape. The envelope is the universal contract.
#
# Versioning: schema_version is a string. Major bumps are breaking. Minor
# bumps are additive (new optional fields allowed). Phase 2 ships v1.
#
# Ref: .claude/engineering/design-archive/lintel-v4.0-reframe-design.md §2.3 (FR-B envelope)
#      docs/concepts/envelope.md

schema_version: "1"
schema_kind: envelope
as_of: 2026-05-29

# ─── HEAD — required metadata ──────────────────────────────────────────────
head:
  required:
    - envelope_id           # string: ULID or UUIDv7, sortable, globally unique
    - envelope_schema_version  # string: must equal this schema's version ("1")
    - kind                  # enum: see kinds below
    - from                  # string: source — skill name, agent name, "operator", "external"
    - to                    # string: destination — skill name, agent name, "operator"
    - issued_at             # string: ISO 8601 UTC timestamp

  optional:
    - cycle_id              # string|null: if envelope is inside a cycle
    - job_id                # string|null: if envelope is inside a job (v3.8)
    - parent_envelope_id    # string|null: if this envelope replies to another
    - pack                  # string|null: active pack name at issue time
    - operator              # string|null: $(whoami) at issue time
    - voice_tier            # enum|null: internal | mixed | external | custom
    - cost_estimate_tokens  # int|null: predicted token cost of consuming this envelope

# ─── kinds (HEAD.kind enum values) ─────────────────────────────────────────
kinds:
  - subagent_spawn          # parent skill spawns a subagent
  - phase_transition        # phase → next phase within a cycle
  - workflow_handoff        # workflow_root → workflow_root
  - cold_executor           # plan + spec + prompt born together (v3.8)
  - operator_input          # operator → skill (curated input)
  - reply                   # subagent → parent (parent_envelope_id required)
  - audit                   # observability emission, no consumer expected

# ─── BODY — payload, shape per `content_type` ──────────────────────────────
body:
  required:
    - content_type          # enum: see content_types below
    - content               # the actual payload (shape varies)

  optional:
    - context_pointers      # list[string]: pointers to additional context (files, urls)
    - guardrails            # list[string]: evaluator names that ran on this body

content_types:
  brief:
    # Structured brief from Brief Forge — task + constraints + acceptance
    required:
      - task                # string: one-sentence statement of what to do
      - constraints         # list[string]: non-negotiable constraints
      - acceptance          # list[string]: how we know it's done
    optional:
      - prior_work          # list[string]: pointers to prior artifacts
      - persona             # string|null: persona this brief targets
      - voice               # string|null: voice tier override

  spec:
    # Structured spec — design contract for the build
    required:
      - intent              # string
      - inputs              # list[{name, type, source}]
      - outputs             # list[{name, type, sink}]
    optional:
      - assumptions
      - non_goals

  plan:
    # Structured plan — task breakdown
    required:
      - tasks               # list[{id, content, status}]
    optional:
      - dependencies
      - cost_estimate

  payload_freeform:
    # Catch-all for content that isn't brief/spec/plan
    required: []
    optional:
      - notes

# ─── TAIL — required closing context ───────────────────────────────────────
tail:
  required:
    - completeness_score    # int 0-100: how complete is this envelope? (Brief Forge writes)
    - evaluators_run        # list[string]: evaluator names that ran on this envelope
    - escape_hatches        # list[string]: how the receiver can request more context
    - audit_pointer         # string: jsonl path where this envelope is logged

  optional:
    - replay_safe           # bool: can this envelope be re-executed via --apply?
                            # default false (require explicit op-in)
    - deprecated_after      # string|null: ISO 8601, after which replay rejects
    - sensitive             # bool: contains sensitive data → audit retention rules apply

# ─── Validation behavior ───────────────────────────────────────────────────
#
# bin/li-envelope-validate runs the following checks:
#   1. Top-level structure: head, body, tail present
#   2. envelope_schema_version matches a known version (Phase 2 accepts "1")
#   3. All HEAD.required fields present
#   4. HEAD.kind is one of the documented kinds
#   5. BODY.content_type is one of the documented content_types
#   6. For each content_type, the type-specific required fields are present
#   7. All TAIL.required fields present
#   8. completeness_score is in [0, 100]
#
# Errors are returned as a list of {field, severity, message} so the caller
# can decide whether to surface, retry, or fail.

# ─── Replay semantics ──────────────────────────────────────────────────────
#
# bin/li-envelope-replay defaults to --dry-run:
#   - Read envelope from disk or audit log
#   - Re-construct invocation: which skill/agent, what brief, what context
#   - Surface to operator: "this is what would run; current state of world is X"
#   - Operator inspects + decides
#
# bin/li-envelope-replay --apply:
#   - Same as dry-run PLUS actually re-invoke the skill/agent with the brief
#   - Requires: envelope.tail.replay_safe == true (or --force override + audit)
#   - Requires: now < deprecated_after (if set)
#   - Writes audit entry "envelope_replay_applied" with original envelope_id
#
# Reason: envelopes capture state at hand-off time. The world may have moved
# on. Dry-run + diff against now lets the operator decide.

# ─── Schema version compatibility ──────────────────────────────────────────
#
# Phase 2 ships v1. Future versions:
#   v1 (this) — additive optional fields allowed
#   v2 — breaking changes (e.g. renaming a HEAD field) → validator handles both
#        until v2 ships are dominant, then v1 grace ends per migration index
