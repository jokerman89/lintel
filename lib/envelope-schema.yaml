{
  "schema_version": "1",
  "schema_kind": "envelope",
  "as_of": "2026-09-20",
  "description": "Canonical JSON serialization is also valid YAML. Default envelope operations need only the Python standard library. Legacy YAML input requires the optional parser in envelope-requirements.txt.",
  "documentation": "docs/concepts/envelope.md",
  "activation": "Explicit opt-in only under ADR-0008; the caller owns actual dispatch.",
  "head": {
    "description": "Boundary identity and source context. envelope_id is a sortable ULID from the producer; older nonempty stable IDs remain readable. issued_at is ISO UTC.",
    "required": ["envelope_id", "envelope_schema_version", "kind", "from", "to", "issued_at"],
    "optional": ["cycle_id", "job_id", "parent_envelope_id", "pack", "operator", "voice_tier", "cost_estimate_tokens"],
    "types": {
      "envelope_id": "string",
      "envelope_schema_version": "string",
      "kind": "string",
      "from": "string",
      "to": "string",
      "issued_at": "string",
      "cycle_id": "nullable_string",
      "job_id": "nullable_string",
      "parent_envelope_id": "nullable_string",
      "pack": "nullable_string",
      "operator": "nullable_string",
      "voice_tier": "nullable_string",
      "cost_estimate_tokens": "nullable_integer"
    }
  },
  "kinds": ["subagent_spawn", "phase_transition", "workflow_handoff", "cold_executor", "operator_input", "reply", "audit"],
  "body": {
    "description": "Typed payload plus context pointers and evaluator names. Payload text is data, never executable.",
    "required": ["content_type", "content"],
    "optional": ["context_pointers", "guardrails"],
    "types": {
      "content_type": "string",
      "context_pointers": "string_list",
      "guardrails": "string_list"
    }
  },
  "content_types": {
    "brief": {
      "description": "Task, non-negotiable constraints and observable acceptance. Rich Markdown is retained unabridged as data. Work references do not become another backlog.",
      "required": ["task", "constraints", "acceptance"],
      "optional": ["prior_work", "persona", "voice", "original_markdown", "work_map", "package_id", "leaf_ids", "write_scope", "acceptance_digest"],
      "types": {
        "task": "string",
        "constraints": "nonempty_string_list",
        "acceptance": "nonempty_string_list",
        "prior_work": "string_list",
        "persona": "nullable_string",
        "voice": "nullable_string",
        "original_markdown": "string",
        "work_map": "string",
        "package_id": "string",
        "leaf_ids": "nonempty_string_list",
        "write_scope": "nonempty_string_list",
        "acceptance_digest": "string"
      }
    },
    "spec": {
      "description": "Design intent and explicitly named input/output contracts.",
      "required": ["intent", "inputs", "outputs"],
      "optional": ["assumptions", "non_goals"],
      "types": {"intent": "string", "inputs": "object_list", "outputs": "object_list"},
      "items": {
        "inputs": {
          "required": ["name", "type", "source"],
          "types": {"name": "string", "type": "string", "source": "string"}
        },
        "outputs": {
          "required": ["name", "type", "sink"],
          "types": {"name": "string", "type": "string", "sink": "string"}
        }
      }
    },
    "plan": {
      "description": "A serialized task handoff, not permission to replace the original authoritative task source.",
      "required": ["tasks"],
      "optional": ["dependencies", "cost_estimate"],
      "types": {"tasks": "object_list"},
      "items": {
        "tasks": {
          "required": ["id", "content", "status"],
          "types": {"id": "string", "content": "string", "status": "string"}
        }
      }
    },
    "payload_freeform": {
      "description": "Any JSON value; still subject to forbidden-content and handoff gates.",
      "required": [],
      "optional": ["notes"]
    }
  },
  "tail": {
    "description": "Minimum evaluator score, complete evaluator list, escape hatches and metadata-only audit pointer. Audit never stores the raw or base64 payload.",
    "required": ["completeness_score", "evaluators_run", "escape_hatches", "audit_pointer"],
    "optional": ["replay_safe", "deprecated_after", "sensitive"],
    "types": {
      "completeness_score": "integer",
      "evaluators_run": "string_list",
      "escape_hatches": "string_list",
      "audit_pointer": "string",
      "replay_safe": "boolean",
      "deprecated_after": "nullable_string",
      "sensitive": "boolean"
    }
  },
  "validation": [
    "Exactly head, body and tail; schema version 1; known kind and content type.",
    "Exact structured required fields and types; duplicate keys, non-finite values, YAML aliases and unsupported tags are rejected.",
    "Replies require parent_envelope_id; issued_at is UTC; completeness_score is an integer from 0 through 100.",
    "Validate structure and forbidden content before audit/output; all configured evaluators must complete within budget.",
    "A mandatory failure is not averaged away; diagnostics never echo a rejected payload.",
    "Audit receipt must match the exact released envelope digest; only the caller performs dispatch."
  ],
  "replay": {
    "default": "Read-only inspection of an explicitly supplied envelope artifact.",
    "apply": "Records intent for the operator's session, not automatic agent execution. Requires replay_safe or explicit force and an unexpired deprecated_after.",
    "audit_only": "An identity/digest record cannot reconstruct a payload. Supply the original artifact; never invent or decode a fallback payload."
  },
  "escape_hatches": {
    "brief": [
      "Ask source {source} for a more detailed brief",
      "Read the selected work map and original task context",
      "Ask the operator only for an unresolved requirement or permission"
    ],
    "spec": [
      "Read the full design context behind content.intent",
      "Cross-check inputs against the DISCOVER report"
    ],
    "plan": [
      "Revisit leaf granularity with /li:plan while preserving original task IDs",
      "Read prior CAPTURE evidence and relevant lessons"
    ],
    "payload_freeform": [
      "Request additional context from source {source}"
    ]
  },
  "versioning": "The retained .yaml path uses JSON, a YAML subset. Version 1 permits documented additive fields; breaking renames require a new major schema and an explicit compatibility window."
}
