# Lintel pack schema v1 — declarative contract for what a pack manifest may declare.
#
# Authoring reference, read by the wiki generator and pack-validation skill.
# Runtime checks are implemented once in lib/profile_context.py, with shell
# adapters in lib/pack-resolver.sh. Only runtime_compatibility below is consumed
# as data; the remaining field descriptions are an authoring reference.
#
# Versioning: schema_version is a string. Major bumps are breaking. Minor bumps
# are additive. Phase 2 ships v1.
#
# Ref: .claude/engineering/design-archive/lintel-v4.0-reframe-design.md §1.3 (pack architecture)

schema_version: "1"
schema_kind: pack-manifest
as_of: 2026-09-20

# Feature contracts are not host capability claims or public product versions.
runtime_compatibility:
  schema_versions: ["1"]
  capabilities:
    pack-inheritance: "1.0.0"
    profile-context: "1.0.0"
    extension-pack: "1.0.0"

# Authoring contract for a complete pack. A derived pack may inherit policy
# blocks; runtime requires name/version per manifest and effective required
# policy fields. Legacy manifests may omit schema_version.
required_fields:
  - name              # string: unique identifier (filesystem-safe, kebab-case)
  - version           # string: semver, e.g. "1.0.0"
  - voice             # block (see voice schema)
  - compliance        # block (see compliance schema)
  - navigation        # block (see navigation schema)

# Optional top-level fields a pack may declare.
optional_fields:
  - extends           # string: name of parent pack to inherit from (shallow merge)
  - shareable         # bool: may this pack be published / git-mv'd to another repo?
  - persona           # block (see persona schema)
  - roles             # block (see roles schema)
  - brand             # block (see brand schema)
  - knowhow           # block (see knowhow schema)
  - lessons           # block (see lessons schema)
  - opinions          # block (see opinions schema)
  - brief_forge_handoffs   # block (see brief_forge_handoffs schema)
  - description       # string: one-line operator-facing summary
  - maintainers       # list[string]: GitHub handles or contact pointers
  - extension         # optional executable-surface declaration (ADR-0018)
  - schema_version    # string: supported manifest schema; absent means legacy "1"
  - requires_lintel   # legacy: exact ">=4.0.0" is the historical pack-v1 marker
  - requires_lintel_product  # string: actual public product semver constraint
  - requires_capabilities    # mapping: feature ID -> feature-contract semver constraint

# ─── Nested block schemas ──────────────────────────────────────────────────

voice:
  required:
    - default_tier      # enum: internal | mixed | external | custom
  optional:
    - corpus            # string|null: path within pack to voice corpus dir
    - enforce           # enum: all | customer_facing | none — default "none"
    - gates_active      # list[string]: voice-gate names this pack opts in

compliance:
  required:
    - mode              # enum: hard | advisory | off
  optional:
    - hooks             # list[string]: hook names this pack activates
    - workprofile_default  # enum: on | off
    - audit_paths       # list[string]: where compliance audits land
    - data_residency    # enum: us | eu | apac | none — default none

navigation:
  required:
    - default_workflow              # string: primary workflow for this pack (e.g. "cycle")
  optional:
    - high_risk_workflows           # list[string]: require confirmation in auto-mode
    - orientator_budget_tokens      # int: LLM input cap per SENSE — default 2000
    - orientator_max_output_tokens  # int: LLM output cap — default 200
    - escalation_threshold          # enum: never | low | medium | high — default medium
    - auto_mode_eligible            # bool: pack may run in auto-mode — default false

persona:
  optional:
    - source                      # string|null: dir of operator persona files
    - voice_alignment             # bool: voice-critic checks operator output vs persona
    - inventory                   # list[string]: persona ids

roles:
  optional:
    - source                      # string|null: dir of role definitions
    - default_role                # string|null
    - inventory                   # list[string]: role ids

brand:
  optional:
    - templates                   # string|null: doc-gen templates dir
    - color_tokens                # string|null: brand color tokens path
    - name                        # string|null: brand display name
    - copy_tone                   # enum: neutral | playful | formal — default neutral

knowhow:
  optional:
    - source                      # string|null: tag-indexed knowledge-base dir
    - override_session_priors     # bool: is override-enforce allowed?
    - domains                     # list[string]: domain tags

lessons:
  optional:
    - packaged                    # string|null: immutable lessons shipped with pack
    - operator_lessons            # string: path to operator's lessons file
    - paths                       # list[string]: additional lessons sources

opinions:
  optional:
    - source                      # string|null: stance documents dir
    - inventory                   # list[string]: stance ids

brief_forge_handoffs:
  optional:
    - on_subagent_spawn           # {enabled: bool, evaluators: list[string]}
    - on_phase_transition         # {enabled: bool, evaluators: list[string]}
    - on_workflow_handoff         # {enabled: bool, evaluators: list[string]}
    - on_cold_executor            # {enabled: bool, evaluators: list[string]}
    - on_operator_input           # {enabled: bool, evaluators: list[string]}
    - cold_path_bypass            # {eligible_skills: list[string]}
    - budget_tokens               # int: total budget per hand-off — default 5000
    - override_allowed            # bool — default true
    - override_requires_audit     # bool — default true

extension:
  optional:
    - is_extension               # bool: pack ships its own plugin surface
    - namespace                  # string: required when is_extension is true
    - workflow                   # string: required when is_extension is true
    - provides_skills            # bool: awareness flag, not host discovery
    - provides_agents            # bool: awareness flag, not host discovery
    - provides_hooks             # bool: awareness flag, not hook activation

# ─── Inheritance semantics ─────────────────────────────────────────────────
#
# `extends:` triggers shallow merge of parent pack into child.
#
# Precedence: child fields override parent fields at the top level. Nested
# blocks (e.g. voice.default_tier) replace the parent's block entirely — they
# do NOT deep-merge. Reason: nested deep-merge produces surprising hybrid
# states that are hard to predict; whole-block replacement is the operator's
# explicit choice.
#
# No list exception: declaring brief_forge_handoffs replaces the whole parent
# block. To add an evaluator, restate the settings/evaluators to retain.
#
# Cycle detection: max-depth 10. If `pack-a extends: pack-b` and
# `pack-b extends: pack-a`, validation rejects.
#
# Missing parent: validation rejects.

# ─── Validation behavior ───────────────────────────────────────────────────
#
# Pack-resolver invokes validate_pack() at SENSE Step 1:
#   1. Manifest file exists
#   2. Matching directory/name and semantic pack version in each manifest
#   3. Required effective fields present after whole-block inheritance:
#      voice.default_tier, compliance.mode, navigation.default_workflow
#   4. Every parent exists, no cycle, at most ten parent links
#   5. compliance.mode is hard/advisory/off; enabled extensions have namespace/workflow
# Supported parsing syntax and limits: skills/pack-validate/SKILL.md.
#   6. Known control lists are scalar string lists; custom fields retain typed data
#   7. Independent schema/product/feature compatibility for every manifest
# This is not a general-purpose YAML schema engine.
#
# Required selection failure: error, no neutral fallback (ADR-0029).
# Optional legacy pointer failure: diagnostic validated neutral fallback.
# Invalid neutral baseline: error. No hardcoded emergency values.
# Bound contexts verify content hashes on every read, including pointer/parents.

# ─── Version compatibility ─────────────────────────────────────────────────
#
# schema_version describes syntax, version identifies the pack release, and
# requires_lintel_product compares against the source .claude-plugin/plugin.json.
# Unknown product metadata cannot satisfy a declared product constraint.
# requires_capabilities uses runtime_compatibility above, not host permissions.
# Constraint grammar: full semver with =, ==, <, <=, >, >=; space/comma-separated
# conjunctions. Unsupported ranges are errors, not approximately evaluated.
# Historical requires_lintel: ">=4.0.0" means legacy pack-v1, NOT public v4+.
# Other requires_lintel values require explicit migration to the new fields.
