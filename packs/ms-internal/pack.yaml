# ms-internal — base pack for Microsoft-internal work
#
# Purpose: defaults that any Microsoft-internal sister-pack to caip-se should
# inherit. Compliance mode, audit paths, data-residency, SDL gates active.
# Does NOT include CAIP-SE-specific voice (Trailblazer), persona corpus, or
# customer-engagement-specific compliance hooks — those live in caip-se/.
#
# Inherits from: _default (implicit; no explicit extends because _default is
# the resolver's fallback layer, not an extends target)
#
# Ref: docs/design/lintel-v4.0-reframe-design.md §1.3 C1-D1 (recommend NOW)

schema_version: "1"
name: ms-internal
version: 1.0.0
description: Microsoft-internal base pack — compliance + audit defaults for any MS work
shareable: false
maintainers: []

# ─── Voice ─────────────────────────────────────────────────────────────────
# Mixed: internal-team default, customer-facing voice opt-in per workflow.
voice:
  default_tier: mixed
  corpus: null                              # ms-internal has no brand corpus
  enforce: customer_facing                  # only enforce voice on customer-facing output
  gates_active:
    - voice_critic                          # hook gate: voice-critic on customer-facing
  trailblazer_corpus_path: null             # Trailblazer voice lives in caip-se pack

# ─── Compliance ────────────────────────────────────────────────────────────
# Hard mode: MS-internal work assumes SDL + WorkProfile-on by default.
compliance:
  mode: hard
  hooks:
    - sdl_threat_model_check
    - sdl_secrets_scan
    - sdl_dependency_audit
    - workprofile_validate
  workprofile_default: on
  audit_paths:
    - ~/.lintel/audit/ms-internal-sdl.jsonl
    - ~/.lintel/audit/ms-internal-secrets.jsonl
    - ~/.lintel/audit/ms-internal-workprofile.jsonl
  sdl_active: true
  data_residency: us                        # default; can be overridden per workflow

# ─── Navigation ────────────────────────────────────────────────────────────
# MS work is multi-workflow; cycle is primary; ship + plan need confirmation.
navigation:
  default_workflow: cycle
  high_risk_workflows:
    - cycle
    - plan
    - ship
  orientator_budget_tokens: 2000
  orientator_max_output_tokens: 200
  escalation_threshold: medium
  auto_mode_eligible: false                 # conservative default per §1.3 C1-D3

# ─── Persona ───────────────────────────────────────────────────────────────
# No personas at this layer; caip-se declares its own (Sales Engineer etc.)
persona:
  source: null
  voice_alignment: false
  inventory: []

# ─── Roles ─────────────────────────────────────────────────────────────────
# No roles at this layer; caip-se declares its own.
roles:
  source: null
  default_role: null
  inventory: []

# ─── Brand ─────────────────────────────────────────────────────────────────
# MS brand reference lives at the caip-se layer (which is the brand-bound work).
brand:
  templates: null
  color_tokens: null
  name: null
  copy_tone: neutral

# ─── Know-how ──────────────────────────────────────────────────────────────
knowhow:
  source: null
  override_session_priors: false
  domains: []

# ─── Lessons ───────────────────────────────────────────────────────────────
lessons:
  packaged: null
  operator_lessons: ~/.lintel/lessons.md
  paths:
    - tasks/lessons.md

# ─── Opinions ──────────────────────────────────────────────────────────────
opinions:
  source: null
  inventory: []

# ─── Brief Forge handoffs ──────────────────────────────────────────────────
# Inherit _default's settings; MS-internal adds SDL evaluator on cold-executor
# spawns (subagents that get cold-executor briefs must pass security check).
brief_forge_handoffs:
  on_subagent_spawn:
    enabled: true
    evaluators: [security, stale, sdl_compliance]
  on_phase_transition:
    enabled: true
    evaluators: [completeness]
  on_workflow_handoff:
    enabled: true
    evaluators: [completeness, sdl_compliance]
  on_cold_executor:
    enabled: true
    evaluators: [security, completeness, sdl_compliance]
  on_operator_input:
    enabled: false
    evaluators: []
  cold_path_bypass:
    eligible_skills: []
  budget_tokens: 6000                       # +1k vs _default for SDL evaluators
  override_allowed: true
  override_requires_audit: true

# ─── Compatibility ─────────────────────────────────────────────────────────
requires_lintel: ">=4.0.0"
