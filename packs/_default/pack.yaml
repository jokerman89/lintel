# Lintel _default pack — neutral baseline
#
# v4.0 Phase 2 (schema_version added) · 2026-05-29
#
# This pack ships with Lintel and represents the neutral-everything baseline.
# Operators layer their own pack on top — authored locally or installed.
# Every field below documents the v2.0 design doc's neutral default.

schema_version: "1"
name: _default
version: 1.0.0
shareable: false                                  # default pack is not for sharing

# ─── Voice ─────────────────────────────────────────────────────────────────
voice:
  default_tier: internal                          # internal | mixed | custom | <pack-defined>
  corpus: null                                    # path within pack to voice corpus
  enforce: none                                   # all | customer_facing | none
  gates_active: []                                # voice gates the pack activates (none in _default)

# ─── Compliance ────────────────────────────────────────────────────────────
compliance:
  mode: advisory                                  # hard | advisory | off
  hooks: []                                       # which Lintel hooks this pack activates
  workprofile_default: off                        # was a separate concept; now a pack field

# ─── Persona ───────────────────────────────────────────────────────────────
persona:
  source: null                                    # path within pack to operator persona
  voice_alignment: false                          # voice-critic checks operator output vs persona?

# ─── Roles ─────────────────────────────────────────────────────────────────
roles:
  source: null                                    # directory of role definitions
  default_role: null

# ─── Brand ─────────────────────────────────────────────────────────────────
brand:
  templates: null                                 # doc-gen templates dir (ppt, web, word)
  color_tokens: null                              # used by /generate-web etc.

# ─── Know-how (knowledge-base) ─────────────────────────────────────────────
knowhow:
  source: null                                    # tag-indexed knowledge base
  override_session_priors: false                  # is override-enforce allowed?

# ─── Lessons ───────────────────────────────────────────────────────────────
lessons:
  packaged: null                                  # immutable lessons shipped with pack
  operator_lessons: ~/.lintel/lessons.md          # operator's own (never in pack)

# ─── Capture (Phase 8 session-end) ─────────────────────────────────────────
# Neutral default: OFF. Operators opt in via their own pack (or a local
# ~/.lintel/packs/_default override): set enabled + a path relative to the
# repo root. Missing path → one WARN + skip, never fails CAPTURE.
capture:
  vault_sink_enabled: false                       # ALSO write a session summary to an external knowledge vault
  vault_sink_path: null                           # e.g. ../my-vault/50-sessions (relative to repo root)

# ─── Opinions ──────────────────────────────────────────────────────────────
opinions:
  source: null                                    # stance documents

# ─── Navigation (orientator at SENSE) ──────────────────────────────────────
navigation:
  default_workflow: cycle                         # primary workflow for this pack
  high_risk_workflows:                            # require confirmation in auto-mode
    - cycle
    - plan
    - ship
  orientator_budget_tokens: 2000                  # LLM input cap per SENSE
  orientator_max_output_tokens: 200               # LLM output cap (200-byte JSON)
  escalation_threshold: medium                    # never | low | medium | high

# ─── Brief Forge handoffs (universal hand-off gate) ────────────────────────
brief_forge_handoffs:
  on_subagent_spawn:
    enabled: true
    evaluators: [security, stale]
  on_phase_transition:
    enabled: true
    evaluators: [completeness]
  on_workflow_handoff:
    enabled: true
    evaluators: [completeness]
  on_cold_executor:
    enabled: true
    evaluators: [security, completeness]
  on_operator_input:
    enabled: false                                # operator input is curated by the operator
    evaluators: []
  cold_path_bypass:
    eligible_skills: []                           # skills declare skip in their own frontmatter
  budget_tokens: 5000                             # total budget per hand-off
  override_allowed: true
  override_requires_audit: true

# ─── Extension (pack ships its own skills/agents/hooks/workflow) ────────────
# An EXTENSION PACK is also a Claude Code plugin: it ships skills/agents/hooks
# via its own plugin manifest (the host CLI does discovery, namespacing, and
# hook registration) and declares them here so Lintel is AWARE of them
# (pack-switch surfaces them; the orientator can route to the pack's workflow).
# Fields are FLAT (two-level) on purpose — resolve_pack_field is a two-level
# resolver (ADR-0018). The neutral _default is NOT an extension pack.
extension:
  is_extension: false        # true → this pack ships executable surface (skills/agents/hooks)
  namespace: null            # skill/agent prefix, e.g. s4l → /s4l:forge (REQUIRED when is_extension)
  workflow: null             # the pack's own cycle/workflow id, e.g. s4l-forge (REQUIRED when is_extension)
  provides_skills: false     # awareness flag: ships a skills/ tree
  provides_agents: false     # awareness flag: ships an agents/ tree
  provides_hooks: false      # awareness flag: ships a hooks/ tree

# ─── Compatibility ─────────────────────────────────────────────────────────
requires_lintel: ">=4.0.0"
