# DECLARATION ONLY — this registry does not fetch, clone, or execute anything.
#
# This file lists external projects that influenced or complement Lintel. The installer does NOT
# act on it: install.sh reads the entries only to print a count ("this installer does not clone
# them"). Lintel includes author-written integration and explicitly attributed adapted
# material. `sources` lists references, not automatic imports; `bundled_materials` records
# the existing distributed third-party material and its notices. See docs/provenance.md in the
# Lintel source repository.
#
# Fields:
#   repo            — git URL (HTTPS) of the upstream repo
#   install_path    — historical reference location; the installer does not create or expand it
#   last_verified   — date we last manually confirmed this URL + license combination
#   license         — SPDX identifier (or "NONE" if upstream has no LICENSE file)
#   tier            — permissive | restricted | reference-only
#                       permissive = review the exact component's MIT/Apache/BSD terms
#                                    and retain required notices; not permission to omit attribution
#                       restricted = component-level terms need review before reuse;
#                                    this label makes no blanket use or redistribution grant
#                       reference-only = catalog/config repo, not a skill pack; install script SKIPS,
#                                        docs point at it for reference
#   install_type    — historical recipe type: git-clone | git-clone-and-setup | reference-only
#   post_install    — historical recipe metadata, never executed by this declaration-only listing
#   description     — one-line summary
#   docs            — URL of the upstream README or docs entry-point
#   license_note    — present only when tier=restricted; explains the obligation

version: 1
last_full_review: 2026-05-26

sources:

  # ----- TIER: permissive (MIT) -----

  gsd-redux:
    # Historical key/path and 2026-05-26 verification are retained. That check used
    # https://github.com/open-gsd/get-shit-done-redux; the current-facing reference
    # below comes from the original 2026-09-28 comparison, not a new URL/license check.
    repo: https://github.com/open-gsd/gsd-core
    install_path: ~/.claude/get-shit-done
    last_verified: 2026-05-26
    license: MIT
    tier: permissive
    install_type: git-clone
    description: "GSD Core — spec-driven agent workflow. Repository reference recorded by the 2026-09-28 review; historical registry key retained."
    docs: https://github.com/open-gsd/gsd-core#readme

  agentshield:
    repo: https://github.com/affaan-m/agentshield
    install_path: ~/.claude/skills/agentshield
    last_verified: 2026-05-26
    license: MIT
    tier: permissive
    install_type: git-clone
    description: "AI agent security scanner — detects vulnerabilities in agent configs, MCP servers, tool permissions. CLI + GitHub Action + GitHub App."
    docs: https://github.com/affaan-m/agentshield#readme

  ecc:
    repo: https://github.com/affaan-m/ECC
    install_path: ~/.claude/skills/ecc
    last_verified: 2026-05-26
    license: MIT
    tier: permissive
    install_type: git-clone
    description: "Everything Claude Code — multi-CLI agent harness. Inventory counts are omitted rather than presented as current."
    docs: https://github.com/affaan-m/ECC#readme

  # ----- TIER: restricted -----

  trailofbits-skills:
    repo: https://github.com/trailofbits/skills
    install_path: ~/.claude/skills/trailofbits
    last_verified: 2026-05-26
    license: CC-BY-SA-4.0
    tier: restricted
    install_type: git-clone
    description: "Trail of Bits security skills — code auditing, vulnerability detection, differential review, CodeQL/Semgrep wrappers, supply-chain auditing."
    docs: https://github.com/trailofbits/skills#readme
    license_note: >
      Historical license assessment only. Review the exact component and intended use
      against its current terms, including attribution and share-alike obligations where
      applicable. This registry does not authorize copying or claim local use is unrestricted.

  anthropic-skills:
    repo: https://github.com/anthropics/skills
    install_path: ~/.claude/skills/anthropic
    last_verified: 2026-05-26
    license: Mixed (Apache-2.0 + source-available)
    tier: restricted
    install_type: git-clone
    description: "Anthropic's official skill examples — mcp-builder, skill-creator, demonstration skills, plus document-creation skills (docx/pdf/pptx/xlsx)."
    docs: https://github.com/anthropics/skills#readme
    license_note: >
      Verify terms for the exact skill and revision before reuse. The earlier review
      distinguished Apache-2.0 examples from source-available document skills; neither
      a repository-wide label nor installing/invoking a tool proves all uses permitted.
      Existing scoped design-profile adaptations and retained notices are listed below.

  # ----- TIER: reference-only -----

  gstack:
    repo: https://github.com/garrytan/gstack
    install_path: ~/.claude/reference/gstack
    last_verified: 2026-05-26
    license: MIT
    tier: reference-only
    install_type: reference-only
    description: "Garry Tan's Claude Code skill pack — 23 opinionated plan/design/review/QA/ship tools. Reference only; not on Lintel's install path."
    docs: https://github.com/garrytan/gstack#readme
    license_note: >
      Lintel grew out of this harness but no longer installs or depends on it. MIT-licensed,
      so reuse is permitted, but the install script SKIPS it — it is kept here as a reference
      pointer, not a required/installable upstream.

  trailofbits-claude-code-config:
    repo: https://github.com/trailofbits/claude-code-config
    install_path: ~/.claude/reference/trailofbits-claude-code-config
    last_verified: 2026-05-26
    license: NONE
    tier: reference-only
    install_type: reference-only
    description: "Trail of Bits' internal Claude Code configuration — opinionated defaults, documentation, workflows. Read it; do not copy."
    docs: https://github.com/trailofbits/claude-code-config#readme
    license_note: >
      No LICENSE file = all rights reserved by default. Reading via browser or git clone
      for personal study is fine (public repo). Redistribution / bundling is NOT
      permitted. Treat as reference material only — the install script will not clone
      this automatically.

  anthropic-plugins-official:
    repo: https://github.com/anthropics/claude-plugins-official
    install_path: ~/.claude/reference/anthropic-plugins-official
    last_verified: 2026-05-26
    license: NONE (top-level); per-plugin licenses apply
    tier: reference-only
    install_type: reference-only
    description: "Anthropic's official plugin catalog — directory of vetted Claude Code plugins. Browse for plugins; each plugin has its own LICENSE."
    docs: https://github.com/anthropics/claude-plugins-official#readme
    license_note: >
      No top-level LICENSE — the README states 'see each linked plugin for the relevant
      LICENSE file'. Use this as a catalog to discover plugins; install individual
      plugins from their own upstream repos, not from this catalog clone.

