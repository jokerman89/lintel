name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-linux:
    name: verify.sh on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Run verify.sh --layers
        run: bash install/verify.sh --layers

      - name: Run verify.sh --frontmatter
        run: bash install/verify.sh --frontmatter

      - name: Run verify.sh --counts
        run: bash install/verify.sh --counts

      - name: Run verify.sh --compliance
        run: bash install/verify.sh --compliance

      - name: Run verify.sh --voice
        run: bash install/verify.sh --voice

      - name: Run verify.sh --tier-stamps
        run: bash install/verify.sh --tier-stamps

      - name: Run verify.sh --upstream
        run: bash install/verify.sh --upstream

      - name: Run verify.sh --cli-matrix
        run: bash install/verify.sh --cli-matrix

      - name: Run verify.sh --all (final aggregate)
        run: bash install/verify.sh --all

  install-linux:
    name: install.sh on Ubuntu (dry-run)
    runs-on: ubuntu-latest
    needs: verify-linux
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Run install.sh (against test JSTACK_HOME)
        env:
          JSTACK_HOME: /tmp/jstack-test
        run: bash install/install.sh

      - name: Verify install
        env:
          JSTACK_HOME: /tmp/jstack-test
        run: |
          bash install/verify.sh --all
          test -d /tmp/jstack-test/scaffolding
          test -d /tmp/jstack-test/hooks
          test -f /tmp/jstack-test/config.yaml

  verify-windows:
    name: install.ps1 on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run install.ps1
        env:
          JSTACK_HOME: C:\jstack-test
        shell: pwsh
        run: install/install.ps1

      - name: Confirm structure
        env:
          JSTACK_HOME: C:\jstack-test
        shell: pwsh
        run: |
          Test-Path C:\jstack-test\scaffolding | Should -Be $true
          Test-Path C:\jstack-test\hooks | Should -Be $true
          Test-Path C:\jstack-test\config.yaml | Should -Be $true

      - name: Run verify.sh via Git Bash
        env:
          JSTACK_HOME: C:\jstack-test
        shell: bash
        run: bash install/verify.sh --all

  unit-tests-linux:
    name: tests/unit on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: bash tests/runner/run-unit.sh

  unit-tests-windows:
    name: tests/unit on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests via Git Bash
        shell: bash
        run: bash tests/runner/run-unit.sh

  e2e-claude-code-only:
    name: tests/e2e claude-code-only on Ubuntu
    runs-on: ubuntu-latest
    needs: unit-tests-linux
    steps:
      - uses: actions/checkout@v4

      - name: Run e2e tests (claude-code-only filter)
        run: bash tests/runner/run-e2e.sh --tag claude-code-only

  e2e-cross-cli:
    name: tests/e2e cross-CLI on Ubuntu
    runs-on: ubuntu-latest
    if: false   # enable when Codex CLI is available in CI runner
    needs: e2e-claude-code-only
    steps:
      - uses: actions/checkout@v4
      - name: Run e2e tests (cross-CLI)
        run: bash tests/runner/run-e2e.sh

  compliance-check:
    name: /onecs-check (when implemented)
    runs-on: ubuntu-latest
    if: false   # enable once /onecs-check has CI-mode
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder
        run: echo "onecs-check CI mode pending implementation"
