# Publishes only the allowlisted presentation; the harness source is never a Pages artifact.
name: Presentation Pages
on:
  push:
    branches: [main]
    paths:
      - 'presentations/tech-shots-2026-09-25/**'
      - '.github/workflows/presentation-pages.yml'
  pull_request:
    paths:
      - 'presentations/tech-shots-2026-09-25/**'
      - '.github/workflows/presentation-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: presentation-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate public boundary, links and timings; build offline kit
        run: python3 presentations/tech-shots-2026-09-25/tools/build.py
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: presentations/tech-shots-2026-09-25/_site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
