name: catalog-regenerate

on:
  push:
    branches: [main]
    paths:
      - 'skills/**/SKILL.md'
      - '.github/workflows/catalog.yml'

jobs:
  regenerate:
    name: auto-regenerate skills/CATALOG.md
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate CATALOG.md from frontmatter
        run: |
          # UTF-8 locale so bash substring counts CHARACTERS, not bytes — head -c
          # severed multibyte chars (em-dash, accented letters) mid-sequence,
          # producing invalid-UTF-8 rows.
          export LC_ALL=C.UTF-8 LANG=C.UTF-8
          {
            echo "# Lintel Skill Catalog"
            echo ""
            echo "Auto-generated from frontmatter on push to main."
            echo "Regenerated by \`.github/workflows/catalog.yml\` on each push when \`skills/**/SKILL.md\` changes."
            echo "Hand-edits are overwritten — edit frontmatter in the source SKILL.md instead."
            echo ""
            echo "Total skills: $(find skills -name 'SKILL.md' | wc -l)"
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""

            # Group by layer
            for layer in foundation personal-advanced other; do
              count=0
              section=""
              while IFS= read -r f; do
                fm_layer=$(grep -m1 '^layer:' "$f" | sed 's/^layer:[ ]*//' | tr -d '\r')
                if [ "$fm_layer" = "$layer" ]; then
                  name=$(grep -m1 '^name:' "$f" | sed 's/^name:[ ]*//' | tr -d '\r')
                  description=$(grep -m1 '^description:' "$f" | sed 's/^description:[ ]*//' | tr -d '\r')
                  # character-safe truncation + ellipsis (NOT head -c, which counts bytes)
                  if [ "${#description}" -gt 120 ]; then description="${description:0:119}…"; fi
                  section+="| \`/li:$name\` | $description |"$'\n'
                  count=$((count + 1))
                fi
              done < <(find skills -name 'SKILL.md' | sort)

              if [ "$count" -gt 0 ]; then
                echo "## $layer layer ($count skills)"
                echo ""
                echo "| Skill | Description |"
                echo "|---|---|"
                printf "%s" "$section"
                echo ""
              fi
            done
          } > skills/CATALOG.md

      - name: Commit if changed
        run: |
          git config user.name "lintel-catalog-bot"
          git config user.email "bot@lintel.local"
          git add skills/CATALOG.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(catalog): auto-regenerate skills/CATALOG.md"
            git push
          else
            echo "No catalog changes."
          fi
